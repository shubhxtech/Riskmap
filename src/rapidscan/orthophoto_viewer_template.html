<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Orthophoto Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f0f2f5;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #canvas-container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: grab; user-select: none;
  }
  #canvas-container.grabbing { cursor: grabbing; }
  img#ortho { display: block; transform-origin: 0 0; }
  #info {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,0.95);
    color: #1da1f2;
    font-family: "Menlo", "Consolas", monospace;
    font-size: 11px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #e2e5ea;
  }
  #controls {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.95);
    color: #1a1a2e;
    border: 1px solid #e2e5ea;
    border-radius: 6px;
    padding: 6px 14px;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  .ctrl-btn:hover { background: #1da1f2; color: #ffffff; border-color: #1da1f2; }
</style>
</head>
<body>
<div id="info">ORTHOPHOTO | Scroll to zoom · Drag to pan</div>
<div id="canvas-container">
  <img id="ortho" src="ODM_IMG_SRC" alt="Orthophoto" draggable="false">
</div>
<div id="controls">
  <button class="ctrl-btn" onclick="zoom(1.25)">＋ Zoom In</button>
  <button class="ctrl-btn" onclick="zoom(0.8)">－ Zoom Out</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>
<script>
  var img     = document.getElementById('ortho');
  var cont    = document.getElementById('canvas-container');
  var scale   = 1.0;
  var tx = 0, ty = 0;
  var dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;

  img.onload = function() { resetView(); };

  function applyTransform() {
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  function resetView() {
    var cw = cont.clientWidth,  ch = cont.clientHeight;
    var iw = img.naturalWidth || img.width || cw;
    var ih = img.naturalHeight || img.height || ch;
    scale = Math.min(cw / iw, ch / ih) * 0.95;
    tx = (cw - iw * scale) / 2;
    ty = (ch - ih * scale) / 2;
    applyTransform();
  }

  function zoom(factor) {
    scale *= factor;
    applyTransform();
  }

  cont.addEventListener('wheel', function(e) {
    e.preventDefault();
    var f = e.deltaY < 0 ? 1.1 : 0.9;
    var rect = cont.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    tx = mx - (mx - tx) * f;
    ty = my - (my - ty) * f;
    scale *= f;
    applyTransform();
  }, { passive: false });

  cont.addEventListener('mousedown', function(e) {
    dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
    cont.classList.add('grabbing');
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    tx = stx + (e.clientX - sx);
    ty = sty + (e.clientY - sy);
    applyTransform();
  });
  document.addEventListener('mouseup', function() {
    dragging = false; cont.classList.remove('grabbing');
  });

  window.addEventListener('resize', resetView);
</script>
</body>
</html>
