<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODM 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --card: #f8f9fa;
      --border: #e2e5ea;
      --accent: #1da1f2;
      --ok: #43a047;
      --text: #1a1a2e;
      --muted: #4a5568;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { width: 100%; height: 100%; padding: 12px; display: grid; grid-template-rows: auto 1fr; gap: 10px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px;
    }
    .title { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.4px; }
    .hint { font-size: 11px; color: var(--muted); }
    model-viewer {
      width: 100%; height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      --progress-bar-color: var(--accent);
      --poster-color: var(--card);
    }
    #errbox {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      text-align: center; padding: 20px; background: rgba(240, 242, 245, 0.92); color: #e53935;
      font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">[ 3D MODEL PREVIEW ]</div>
      <div class="hint">Left-drag rotate · Scroll zoom · Right-drag pan</div>
    </div>
    <div style="position:relative; min-height:0;">
      <model-viewer
        id="viewer"
        src="ODM_GLB_SRC"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        ar
        loading="eager"
        reveal="auto">
      </model-viewer>
      <div id="errbox">
        Could not load 3D model preview.<br><br>
        Tips:<br>
        - If you’re offline, the viewer script may not load.<br>
        - Very large GLBs can take time to appear.<br>
        - If this persists, open the GLB from the “Output Files” list externally.
      </div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const err = document.getElementById("errbox");
    viewer.addEventListener("error", () => { err.style.display = "flex"; });

    // If model-viewer fails to load (e.g. no network / CDN blocked),
    // the element remains unknown and no 'error' event fires.
    window.setTimeout(() => {
      const isUpgraded = !!(viewer && viewer.modelIsVisible !== undefined);
      const mvDefined = !!window.customElements && !!customElements.get("model-viewer");
      if (!mvDefined || !isUpgraded) {
        err.style.display = "flex";
        err.innerHTML =
          "3D viewer script didn’t load.<br><br>" +
          "This preview uses <b>model-viewer</b> from a CDN.<br>" +
          "If you’re offline or the network blocks it, the 3D preview can’t render.<br><br>" +
          "Workaround: open the GLB from the “Output Files” list externally.";
      }
    }, 1500);
  </script>
</body>
</html>
